<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformer Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-[#0B0F19] text-slate-200 font-sans selection:bg-blue-500/30 min-h-screen p-6 md:p-12">

    <!-- Header Area -->
    <div class="max-w-5xl mx-auto mb-10">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 tracking-tight flex items-center">
            Transformer Attention
        </h1>
        <p class="text-lg text-slate-400 max-w-2xl mb-8 leading-relaxed">
            Visualize self-attention, token relationships, and QKV matrix computation in real-time. Enter a short phrase to see how a Transformer models it.
        </p>

        <div class="bg-slate-800/40 border border-slate-700/50 p-2 rounded-xl flex items-center focus-within:ring-2 ring-blue-500/50 focus-within:border-blue-500/50 transition-all">
            <input
                type="text"
                id="text-input"
                value="Time flies like an arrow"
                class="flex-1 bg-transparent border-none outline-none px-4 py-2 text-white placeholder:text-slate-600 text-lg"
                placeholder="Type a sentence (e.g., The quick brown fox)"
                maxlength="60"
            />
            <div id="token-count" class="px-4 text-xs font-mono text-slate-500 flex items-center">
                0 TOKENS
            </div>
        </div>
        <p id="truncation-warning" class="text-amber-400/80 text-xs mt-2 ml-2 items-center hidden">
            <svg class="w-3 h-3 mr-1 inline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            Display truncated to 7 tokens for visual clarity.
        </p>
    </div>

    <!-- Main Content Flow -->
    <div id="app-content" class="max-w-5xl mx-auto space-y-6">
        <!-- Waiting State -->
        <div id="waiting-state" class="flex items-center justify-center h-64 border-2 border-dashed border-slate-800 rounded-xl hidden">
            <p class="text-slate-500 flex items-center">
                <svg class="w-5 h-5 mr-2 animate-spin-slow" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                Awaiting input sequence...
            </p>
        </div>

        <div id="sections-container">
            <!-- Sections will be injected here by JS -->
        </div>
    </div>

    <script>
        // --- Math & Helper Functions ---
        const dotProduct = (a, b) => a.reduce((sum, val, i) => sum + val * b[i], 0);
        const transpose = (m) => m[0].map((_, i) => m.map(row => row[i]));
        const matMul = (a, b) => a.map(row => transpose(b).map(col => dotProduct(row, col)));
        const softmax = (arr) => {
            const max = Math.max(...arr);
            const exps = arr.map(x => Math.exp(x - max));
            const sum = exps.reduce((acc, val) => acc + val, 0);
            return exps.map(x => x / sum);
        };
        const softmaxMatrix = (m) => m.map(row => softmax(row));

        const hashStr = (str) => {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0; 
            }
            return hash;
        };

        const getEmbedding = (token, size = 4) => {
            const seed = hashStr(token.toLowerCase());
            return Array.from({ length: size }, (_, i) => {
                return Math.sin(seed * 13.37 + i * 42.42);
            });
        };

        // Fixed Weights
        const W_Q = [[0.8, -0.2, 0.4], [-0.3, 0.7, 0.1], [0.5, 0.5, -0.6], [0.1, -0.4, 0.9]];
        const W_K = [[-0.5, 0.4, 0.2], [0.6, -0.1, 0.8], [0.3, 0.9, -0.4], [-0.2, 0.5, 0.7]];
        const W_V = [[0.2, -0.1, 0.6, 0.3], [0.5, 0.4, -0.2, 0.1], [-0.3, 0.7, 0.5, -0.4], [0.1, -0.2, 0.3, 0.8]];

        // State
        let modelData = null;
        let hoverRow = -1;
        let hoverCol = -1;
        
        // Icons
        const icons = {
            chevronDown: `<svg class="w-5 h-5 text-slate-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`,
            chevronUp: `<svg class="w-5 h-5 text-slate-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>`,
            mousePointer: `<svg class="w-5 h-5 animate-pulse" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg>`,
            arrowRight: `<svg class="w-12 h-12 text-slate-700" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`
        };

        // UI Generators
        function generateMatrixHTML(data, rowLabels, colLabels, title, hRow, hCol, colorScale = false) {
            let html = `<div class="flex flex-col items-center">`;
            if (title) html += `<h4 class="text-slate-400 text-sm font-medium mb-2">${title}</h4>`;
            html += `<div class="flex">`;
            
            if (rowLabels) {
                html += `<div class="flex flex-col justify-center mr-2 space-y-1">`;
                rowLabels.forEach((lbl, i) => {
                    const activeClass = (hRow === i) ? 'text-blue-400' : 'text-slate-500';
                    html += `<div class="h-8 flex items-center justify-end pr-2 text-xs font-medium transition-colors ${activeClass}">${lbl}</div>`;
                });
                html += `</div>`;
            }

            html += `<div>`;
            if (colLabels) {
                html += `<div class="flex mb-1 space-x-1">`;
                colLabels.forEach((lbl, i) => {
                    const activeClass = (hCol === i) ? 'text-blue-400' : 'text-slate-500';
                    html += `<div class="w-12 text-center text-xs font-medium transition-colors ${activeClass}">${lbl}</div>`;
                });
                html += `</div>`;
            }

            html += `<div class="bg-slate-800/50 p-1 rounded border border-slate-700 grid gap-1" style="grid-template-columns: repeat(${data[0].length}, minmax(0, 1fr))">`;
            data.forEach((row, i) => {
                row.forEach((val, j) => {
                    const isHighlighted = (hRow === i || hCol === j);
                    let bgColor = 'bg-slate-800';
                    let textColor = 'text-slate-300';
                    let inlineStyle = '';
                    let extraClass = '';

                    if (colorScale) {
                        const intensity = Math.max(0, Math.min(1, val));
                        bgColor = `rgba(59, 130, 246, ${intensity * 0.8})`;
                        textColor = intensity > 0.5 ? 'text-white' : 'text-slate-300';
                        inlineStyle = `background-color: ${bgColor}`;
                    } else if (isHighlighted) {
                        bgColor = 'bg-slate-700';
                        textColor = 'text-blue-300';
                        extraClass = 'ring-1 ring-blue-500/50';
                    }

                    html += `<div class="w-12 h-8 flex items-center justify-center text-xs font-mono rounded transition-all duration-200 ${bgColor} ${textColor} ${extraClass}" style="${inlineStyle}">${val.toFixed(2)}</div>`;
                });
            });
            html += `</div></div></div></div>`;
            return html;
        }

        function createSection(step, title, description, innerHTML, id) {
            return `
            <div class="mb-8 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm" id="section-${id}">
                <div class="px-6 py-4 bg-slate-800/30 border-b border-slate-800 flex items-center justify-between cursor-pointer hover:bg-slate-800/50 transition-colors" onclick="toggleSection('${id}')">
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center justify-center w-8 h-8 rounded-full bg-blue-500/10 text-blue-400 font-bold border border-blue-500/20">${step}</div>
                        <div>
                            <h3 class="text-lg font-semibold text-slate-100">${title}</h3>
                            ${description ? `<p class="text-sm text-slate-400 mt-0.5">${description}</p>` : ''}
                        </div>
                    </div>
                    <div id="icon-${id}">${icons.chevronUp}</div>
                </div>
                <div class="p-6" id="content-${id}">
                    ${innerHTML}
                </div>
            </div>`;
        }

        window.toggleSection = (id) => {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.innerHTML = icons.chevronUp;
            } else {
                content.classList.add('hidden');
                icon.innerHTML = icons.chevronDown;
            }
        };

        function processData(text) {
            const rawTokens = text.trim().split(/\s+/).filter(Boolean);
            const tokens = rawTokens.slice(0, 7);
            
            if (tokens.length === 0) return null;

            const X = tokens.map(t => getEmbedding(t, 4));
            const Q = matMul(X, W_Q);
            const K = matMul(X, W_K);
            const V = matMul(X, W_V);
            const K_T = transpose(K);
            const scores = matMul(Q, K_T);
            
            const d_k = 3;
            const scaledScores = scores.map(row => row.map(v => v / Math.sqrt(d_k)));
            const attentionWeights = softmaxMatrix(scaledScores);
            const output = matMul(attentionWeights, V);

            return { tokens, X, Q, K, V, K_T, scores, scaledScores, attentionWeights, output, d_k };
        }

        function renderApp() {
            const container = document.getElementById('sections-container');
            const waitingState = document.getElementById('waiting-state');
            const tokenCount = document.getElementById('token-count');
            const warn = document.getElementById('truncation-warning');
            
            const text = document.getElementById('text-input').value;
            modelData = processData(text);

            if (!modelData) {
                container.innerHTML = '';
                waitingState.classList.remove('hidden');
                tokenCount.innerText = '0 TOKENS';
                warn.classList.add('hidden');
                return;
            }

            waitingState.classList.add('hidden');
            tokenCount.innerText = `${modelData.tokens.length} TOKENS`;
            
            const rawLength = text.trim().split(/\s+/).filter(Boolean).length;
            if (rawLength > 7) warn.classList.remove('hidden');
            else warn.classList.add('hidden');

            let html = '';

            // Section 1
            const s1Content = `
                <div class="flex flex-col md:flex-row items-start md:items-center gap-8">
                    <div class="flex-1 text-slate-400 text-sm leading-relaxed space-y-4">
                        <p>Before a transformer can process text, it splits the sequence into <strong>tokens</strong> and maps each token to a vector (an array of numbers) known as an <strong>embedding</strong>.</p>
                        <p>In this demo, our dimension d<sub>model</sub> = 4. So our Input Matrix X has shape <code class="bg-slate-800 px-1 py-0.5 rounded text-blue-300">${modelData.tokens.length} × 4</code>.</p>
                    </div>
                    <div class="flex-shrink-0 bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                        ${generateMatrixHTML(modelData.X, modelData.tokens, ['d1', 'd2', 'd3', 'd4'], "Input Embeddings Matrix (X)", -1, -1)}
                    </div>
                </div>
            `;
            html += createSection("1", "Token Embeddings (X)", "Words are converted into dense numerical vectors.", s1Content, "s1");

            // Section 2
            const s2Content = `
                <div class="text-slate-400 text-sm leading-relaxed mb-6">
                    <p>The core of self-attention involves three representations for every token:</p>
                    <ul class="list-disc list-inside mt-2 space-y-1 ml-2">
                        <li><span class="text-indigo-400 font-medium">Query (Q)</span>: What am I looking for?</li>
                        <li><span class="text-emerald-400 font-medium">Key (K)</span>: What do I contain?</li>
                        <li><span class="text-amber-400 font-medium">Value (V)</span>: What is my actual information?</li>
                    </ul>
                    <p class="mt-4 text-xs">Calculated via Q = X W<sup>Q</sup>, K = X W<sup>K</sup>, V = X W<sup>V</sup>. (Showing dimensions d<sub>k</sub>=3, d<sub>v</sub>=4).</p>
                </div>
                <div class="flex flex-wrap gap-6 justify-center lg:justify-between items-start" id="qkv-container">
                   <!-- Injected by renderQKV -->
                </div>
            `;
            html += createSection("2", "Q, K, V Projections", "Embeddings are multiplied by weight matrices to create Queries, Keys, and Values.", s2Content, "s2");

            // Section 3
            let heatmapHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div>
                        <p class="text-slate-400 text-sm leading-relaxed mb-6">
                            To find out how much attention token i should pay to token j, we take the <strong>dot product</strong> of Query i and Key j. We then scale this down by √d<sub>k</sub> to keep gradients stable.
                        </p>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-2 text-slate-500">${icons.mousePointer}</div>
                            <h4 class="text-slate-300 text-sm font-medium mb-4">Hover over the matrix below!</h4>
                            
                            <div class="inline-block relative">
                                <div class="flex ml-16 mb-2">
                                    ${modelData.tokens.map(t => `<div class="w-12 text-center text-xs text-emerald-400 font-medium rotate-45 origin-bottom-left ml-2">${t}</div>`).join('')}
                                </div>
                                <div class="flex">
                                    <div class="flex flex-col justify-center mr-4 w-12 items-end space-y-1">
                                        ${modelData.tokens.map(t => `<div class="h-10 text-xs text-indigo-400 font-medium flex items-center justify-end">${t}</div>`).join('')}
                                    </div>
                                    <div class="bg-slate-800/80 p-2 rounded-lg border border-slate-700 grid gap-1 relative" style="grid-template-columns: repeat(${modelData.tokens.length}, minmax(0, 1fr))" onmouseleave="setHover(-1, -1)">
                                        ${modelData.attentionWeights.map((row, i) => 
                                            row.map((val, j) => {
                                                const intensity = Math.max(0, Math.min(1, val));
                                                const bg = `rgba(59, 130, 246, ${Math.max(0.05, intensity)})`;
                                                const textClass = intensity > 0.5 ? 'text-white font-medium' : 'text-slate-300';
                                                return `
                                                <div class="group relative inline-block">
                                                    <div class="w-10 h-10 sm:w-12 sm:h-10 cursor-pointer flex items-center justify-center text-xs font-mono rounded transition-all duration-150 relative ${textClass} hover:scale-105 hover:z-10" 
                                                         style="background-color: ${bg}" 
                                                         onmouseenter="setHover(${i}, ${j})" 
                                                         id="cell-${i}-${j}">
                                                        ${val.toFixed(2)}
                                                    </div>
                                                    <div class="opacity-0 w-48 bg-slate-800 text-slate-300 text-xs rounded-md py-2 px-3 absolute z-50 bottom-full left-1/2 -translate-x-1/2 mb-2 pointer-events-none group-hover:opacity-100 transition-opacity duration-200 shadow-xl border border-slate-700">
                                                        <div class="text-center">
                                                            <div><span class="text-indigo-300">${modelData.tokens[i]}</span> attends to <span class="text-emerald-300">${modelData.tokens[j]}</span></div>
                                                            <div class="font-mono mt-1 text-[10px]">Weight: ${(val*100).toFixed(1)}%</div>
                                                        </div>
                                                        <svg class="absolute text-slate-800 h-2 w-full left-0 top-full" x="0px" y="0px" viewBox="0 0 255 255"><polygon class="fill-current" points="0,0 127.5,127.5 255,0"/></svg>
                                                    </div>
                                                </div>
                                                `;
                                            }).join('')
                                        ).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col justify-center items-center p-6 bg-slate-800/30 rounded-xl border border-slate-700/50" id="formula-container">
                        <!-- Injected by renderFormula -->
                    </div>
                </div>
            `;
            html += createSection("3", "Attention Scores (Interactive)", "Calculating token relationships using Dot Product.", heatmapHTML, "s3");

            // Section 4
            const s4Content = `
                <div class="flex flex-col lg:flex-row gap-8 items-center">
                    <div class="flex-1 text-slate-400 text-sm leading-relaxed">
                        <p class="mb-4">The final step is to multiply the Attention Weights by the Value matrix V.</p>
                        <p>This means the new representation for a word is a mixture of the Values of <em>all</em> words in the sequence, weighted by how much attention it paid to them. The word has now gained <strong>context</strong>.</p>
                        <div class="bg-slate-800/50 p-4 rounded-lg font-mono text-center text-xs mt-6 border border-slate-700/50 text-blue-300">
                            Output = Softmax( Q · K<sup>T</sup> / √d<sub>k</sub> ) · V
                        </div>
                    </div>
                    <div class="flex-shrink-0 bg-slate-900/80 p-5 rounded-xl border border-blue-900/30 shadow-lg shadow-blue-900/10">
                        ${generateMatrixHTML(modelData.output, modelData.tokens, ['v1', 'v2', 'v3', 'v4'], "Contextualized Embeddings (Output)", -1, -1)}
                    </div>
                </div>
            `;
            html += createSection("4", "Final Output Generation", "The weighted sum of Values (Attention × V).", s4Content, "s4");

            container.innerHTML = html;
            renderQKV();
            renderFormula();
        }

        window.setHover = (r, c) => {
            if(hoverRow === r && hoverCol === c) return;
            
            // Clean up old highlight
            if(hoverRow !== -1 && hoverCol !== -1) {
                const oldCell = document.getElementById(`cell-${hoverRow}-${hoverCol}`);
                if(oldCell) oldCell.classList.remove('ring-2', 'ring-white', 'scale-110', 'z-10', 'shadow-lg');
            }

            hoverRow = r;
            hoverCol = c;

            // Apply new highlight
            if(hoverRow !== -1 && hoverCol !== -1) {
                const newCell = document.getElementById(`cell-${hoverRow}-${hoverCol}`);
                if(newCell) newCell.classList.add('ring-2', 'ring-white', 'scale-110', 'z-10', 'shadow-lg');
            }

            renderQKV();
            renderFormula();
        };

        function renderQKV() {
            if(!modelData) return;
            const container = document.getElementById('qkv-container');
            if(!container) return;
            container.innerHTML = `
                <div class="p-4 border border-indigo-900/50 bg-indigo-950/10 rounded-xl">
                    ${generateMatrixHTML(modelData.Q, modelData.tokens, null, "Queries Matrix (Q)", hoverRow, -1)}
                </div>
                <div class="p-4 border border-emerald-900/50 bg-emerald-950/10 rounded-xl">
                    ${generateMatrixHTML(modelData.K, modelData.tokens, null, "Keys Matrix (K)", hoverCol, -1)}
                </div>
                <div class="p-4 border border-amber-900/50 bg-amber-950/10 rounded-xl">
                    ${generateMatrixHTML(modelData.V, modelData.tokens, null, "Values Matrix (V)", -1, -1)}
                </div>
            `;
        }

        function renderFormula() {
            if(!modelData) return;
            const container = document.getElementById('formula-container');
            if(!container) return;

            if(hoverRow !== -1 && hoverCol !== -1) {
                const qVec = modelData.Q[hoverRow].map(v => `<div class="w-10 text-center text-indigo-200">${v.toFixed(2)}</div>`).join('');
                const kVec = modelData.K[hoverCol].map(v => `<div class="w-10 text-center text-emerald-200">${v.toFixed(2)}</div>`).join('');
                const raw = modelData.scores[hoverRow][hoverCol].toFixed(2);
                const pct = (modelData.attentionWeights[hoverRow][hoverCol] * 100).toFixed(1);

                container.innerHTML = `
                    <div class="w-full space-y-6">
                        <h4 class="text-center text-slate-300 font-medium mb-4">
                            Calculating Score for <span class="text-indigo-400 font-bold">"${modelData.tokens[hoverRow]}"</span> → <span class="text-emerald-400 font-bold">"${modelData.tokens[hoverCol]}"</span>
                        </h4>
                        
                        <div class="flex items-center justify-center space-x-2 text-sm font-mono overflow-x-auto pb-2">
                            <div class="flex flex-col items-center">
                                <span class="text-indigo-400 text-xs mb-1">Q_${hoverRow}</span>
                                <div class="flex space-x-1 bg-indigo-950/40 p-2 rounded border border-indigo-900">${qVec}</div>
                            </div>
                            <div class="text-slate-500 font-bold">·</div>
                            <div class="flex flex-col items-center">
                                <span class="text-emerald-400 text-xs mb-1">K_${hoverCol}</span>
                                <div class="flex space-x-1 bg-emerald-950/40 p-2 rounded border border-emerald-900">${kVec}</div>
                            </div>
                            <div class="text-slate-500 font-bold">=</div>
                            <div class="flex flex-col items-center">
                                <span class="text-slate-400 text-xs mb-1">Raw Score</span>
                                <div class="p-2 bg-slate-800 rounded border border-slate-700 text-white w-14 text-center">${raw}</div>
                            </div>
                        </div>

                        <div class="text-center text-slate-400 text-sm">↓ Scale & Softmax ↓</div>
                        <div class="flex justify-center">
                            <div class="flex flex-col items-center">
                                <span class="text-blue-400 text-xs mb-1">Attention Weight</span>
                                <div class="p-3 bg-blue-900/30 rounded-lg border border-blue-500/50 text-blue-300 text-lg font-bold">${pct}%</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="text-center text-slate-500 flex flex-col items-center space-y-4">
                        ${icons.arrowRight}
                        <p>Hover over a cell in the heatmap to see the exact calculation.</p>
                    </div>
                `;
            }
        }

        // Init
        document.getElementById('text-input').addEventListener('input', renderApp);
        renderApp();
    </script>
